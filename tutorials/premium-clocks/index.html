<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Premium clocks | StyleSheet Snacks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <h1>Premium clocks</h1>
  <section class="demo" id="neon">
    <div class="neon" role="img" aria-label="Analog clock">
      <span class="radar"></span>
      <i class="h"></i>
      <i class="m"></i>
      <i class="s"></i>
    </div>
  </section>
  <section class="demo" id="pro">
    <div class="neon pro" role="img" aria-label="Radar clock">
      <span class="hud"></span>
      <span class="radar"></span>
      <b></b><b></b><b></b>
      <i class="h"></i>
      <i class="m"></i>
      <i class="s"></i>
    </div>
  </section>
  <section class="demo" id="digital">
    <div class="digital" role="img" aria-label="Digital clock">
      <span class="h"></span><b>:</b><span class="m"></span><b>:</b><span class="s"></span>
      <i class="bar"></i>
    </div>
  </section>
  <section class="demo" id="flip">
    <div class="flip" role="img" aria-label="Flip clock">
      <div class="card m"><span class="old"></span><span class="new"></span></div>
      <b>:</b>
      <div class="card s"><span class="old"></span><span class="new"></span></div>
    </div>
  </section>
  <section class="demo" id="rings">
    <div class="rings" role="img" aria-label="Activity ring clock">
      <i class="s"></i>
      <i class="m"></i>
      <i class="h"></i>
      <p class="time"><span class="hh"></span>:<span class="mm"></span></p>
    </div>
  </section>
  <section class="demo" id="orbit">
    <div class="orbit" role="img" aria-label="Orbit clock">
      <span class="stars"></span>
      <span class="sun"></span>
      <i class="s"></i>
      <i class="m"></i>
      <i class="h"></i>
    </div>
  </section>
  <section class="demo" id="glass">
    <div class="watch" role="img" aria-label="Glass watch">
      <span class="sub"><i></i></span>
      <b class="date">9</b>
      <i class="h"></i>
      <i class="m"></i>
      <i class="s"></i>
      <span class="glare"></span>
    </div>
  </section>
  <section class="demo" id="pendulum">
    <div class="pendulum" role="img" aria-label="Pendulum clock">
      <div class="face">
        <b>XII</b><b>III</b><b>VI</b><b>IX</b>
        <i class="h"></i>
        <i class="m"></i>
        <i class="s"></i>
      </div>
      <span class="rod"></span>
    </div>
  </section>
  <section class="demo" id="leds">
    <div class="leds" role="img" aria-label="LED ring clock">
      <span class="pulse"></span>
      <i class="s"></i>
      <i class="m"></i>
      <p class="time"><span class="hh"></span>:<span class="mm"></span></p>
    </div>
  </section>
</main>

</body>
</html>
